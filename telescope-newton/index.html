<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Télescope de Newton — Simulation</title>
<meta name="description" content="Simulation interactive du télescope de Newton : marche des rayons, démonstration du grossissement G = f₁/f₂, construction pas à pas.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2714%27%20fill%3D%27%2304080f%27/%3E%3Ccircle%20cx%3D%2732%27%20cy%3D%2732%27%20r%3D%2718%27%20fill%3D%27none%27%20stroke%3D%27%2343e0b8%27%20stroke-width%3D%275%27/%3E%3Cpath%20d%3D%27M14%2032h36%27%20stroke%3D%27%2343e0b8%27%20stroke-width%3D%273%27%20stroke-dasharray%3D%275%203%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#04080f; --panel:#0a1426; --line:rgba(110,170,255,.16);
  --ink:#eaf2ff; --mut:#8aa0c4;
  --amber:#ffb84d; --amber2:#ffd98f; --cyan:#5fd9ff; --teal:#43e0b8; --coral:#ff7a59; --sol:#ffd24a;
  --disp:'Unbounded',sans-serif; --body:'Space Grotesk',sans-serif; --mono:'Space Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:var(--body);color:var(--ink);font-size:16px;
  background:
    radial-gradient(1000px 640px at 80% -14%, rgba(28,52,110,.5) 0%, transparent 60%),
    radial-gradient(820px 520px at -8% 110%, rgba(40,90,140,.10) 0%, transparent 55%),
    var(--bg0);}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.app{position:relative;z-index:1;max-width:1560px;margin:0 auto;
  height:100vh;height:100dvh;display:flex;flex-direction:column;gap:11px;padding:14px 18px 12px}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
header{flex:none;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);padding-bottom:10px;animation:rise .55s .05s both}
.h-right{display:flex;flex-direction:column;align-items:flex-end;gap:9px}
.lang-btn{display:inline-flex;align-items:center;gap:7px;font:700 11px var(--mono);letter-spacing:.14em;
  padding:6px 13px;border:1px solid rgba(95,217,255,.4);border-radius:20px;background:rgba(95,217,255,.07);
  color:var(--cyan);cursor:pointer;transition:.2s;text-transform:uppercase}
.lang-btn:hover{background:rgba(95,217,255,.16);box-shadow:0 0 14px rgba(95,217,255,.3);transform:translateY(-1px)}
.lg-globe{font-size:13px}
.overline{font:400 13px var(--mono);letter-spacing:.3em;color:var(--mut);text-transform:uppercase;display:flex;align-items:center;gap:9px}
.overline::before{content:'';width:7px;height:7px;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
h1{font-family:var(--disp);font-weight:900;font-size:clamp(20px,2.3vw,29px);letter-spacing:.02em;margin-top:5px;line-height:1}
h1 span{color:var(--cyan);text-shadow:0 0 22px rgba(95,217,255,.45)}
.tabs{display:flex;gap:6px}
.tabs button{position:relative;background:none;border:1px solid transparent;border-radius:6px;cursor:pointer;
  padding:6px 16px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:.22s}
.tabs .num{font:700 17px var(--disp);color:var(--mut);transition:.22s}
.tabs .lbl{font:400 12.5px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
.tabs button::after{content:'';position:absolute;left:14%;right:14%;bottom:3px;height:2px;background:var(--cyan);
  transform:scaleX(0);transform-origin:left;transition:transform .3s;box-shadow:0 0 8px var(--cyan)}
.tabs button:hover{background:rgba(110,170,255,.06)}
.tabs button:hover .num{color:var(--ink)}
.tabs button.active .num{color:var(--cyan)} .tabs button.active .lbl{color:var(--ink)}
.tabs button.active::after{transform:scaleX(1)}
.tabs button:focus{outline:none}.tabs button:focus-visible{border-color:rgba(95,217,255,.4)}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px}

.stage{min-height:0;display:flex;flex-direction:column;gap:10px;animation:rise .55s .15s both}
.viewport{position:relative;flex:1;min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:10px;
  background:linear-gradient(180deg,rgba(8,18,34,.55),rgba(3,7,14,.88));box-shadow:inset 0 0 90px rgba(2,5,12,.9)}
.viewport::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px)}
#sim{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.ck{position:absolute;width:15px;height:15px;border:0 solid var(--cyan);opacity:.8;pointer-events:none;z-index:3}
.ck.tl{top:9px;left:9px;border-top-width:2px;border-left-width:2px}
.ck.tr{top:9px;right:9px;border-top-width:2px;border-right-width:2px}
.ck.bl{bottom:9px;left:9px;border-bottom-width:2px;border-left-width:2px}
.ck.br{bottom:9px;right:9px;border-bottom-width:2px;border-right-width:2px}
.hud{position:absolute;z-index:2;pointer-events:none}
.hud-top{top:16px;left:20px;max-width:380px}
.title-row{display:flex;align-items:baseline;gap:26px;flex-wrap:wrap}
.def-inline{position:relative;font:700 18px var(--disp);line-height:1;color:var(--ink);cursor:help;
  pointer-events:auto;transition:color .2s,text-shadow .2s;white-space:nowrap}
.def-inline:hover{color:var(--cyan);text-shadow:0 0 18px rgba(95,217,255,.4)}
.def-pop{position:absolute;top:calc(100% + 10px);left:0;width:340px;padding:11px 14px;z-index:6;
  border:1px solid rgba(95,217,255,.4);border-radius:8px;background:rgba(8,12,22,.97);
  box-shadow:0 8px 30px rgba(0,0,0,.5);color:var(--mut);font:400 13px/1.5 var(--body);
  opacity:0;transform:translateY(-4px);transition:.2s;pointer-events:none;white-space:normal}
.def-inline:hover .def-pop{opacity:1;transform:none}
.law-k{font:700 13px var(--mono);letter-spacing:.3em;color:var(--cyan)}
.law-t{font:700 18px var(--disp);margin:5px 0 4px;line-height:1.1}
.law-d{font-size:13.5px;line-height:1.4;color:var(--mut);max-width:380px}

.tip{position:absolute;z-index:5;pointer-events:none;width:280px;padding:9px 12px;border:1px solid rgba(95,217,255,.45);
  border-radius:8px;background:rgba(5,10,20,.96);box-shadow:0 8px 26px rgba(0,0,0,.55);
  opacity:0;transition:opacity .12s;font:400 13px/1.45 var(--body);color:var(--mut)}
.tip.on{opacity:1}
.tip b{display:block;font:700 13px var(--mono);color:var(--cyan);margin-bottom:3px;letter-spacing:.02em}
.tip em{display:block;margin-top:5px;font:700 11.5px var(--mono);font-style:normal;color:var(--amber2);letter-spacing:.05em}

.hud-flash{left:50%;bottom:14px;transform:translate(-50%,6px);font:700 12px var(--mono);letter-spacing:.08em;
  color:var(--teal);opacity:0;transition:.35s;text-align:center;white-space:nowrap;max-width:90%;
  padding:5px 12px;border-radius:20px;background:rgba(4,9,18,.85);border:1px solid rgba(67,224,184,.3)}
.hud-flash.on{opacity:1;transform:translate(-50%,0)}
.hud-indicator{top:18px;right:20px;display:flex;align-items:center;gap:8px;font:700 11.5px var(--mono);
  letter-spacing:.1em;padding:6px 12px;border:1px solid var(--line);border-radius:20px;background:rgba(4,8,16,.6);text-transform:uppercase}
.ind-dot{width:9px;height:9px;border-radius:50%;flex:none}
.hud-indicator.run{color:var(--teal);border-color:rgba(67,224,184,.4)}
.run .ind-dot{background:var(--teal);box-shadow:0 0 8px var(--teal);animation:blink 1.4s infinite}
.hud-indicator.low{color:var(--amber2);border-color:rgba(255,184,77,.4)}
.low .ind-dot{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.hud-indicator.warn{color:var(--coral);border-color:rgba(255,122,89,.4)}
.warn .ind-dot{background:var(--coral);box-shadow:0 0 8px var(--coral)}
.zoom-btn{position:absolute;right:16px;bottom:14px;z-index:4;display:inline-flex;align-items:center;gap:6px;font:700 11px var(--mono);letter-spacing:.1em;padding:7px 12px;border:1px solid rgba(95,217,255,.4);border-radius:20px;background:rgba(4,9,18,.85);color:var(--cyan);cursor:pointer;transition:.2s;text-transform:uppercase}
.zoom-btn:hover{background:rgba(95,217,255,.16);box-shadow:0 0 14px rgba(95,217,255,.3)}
.zoom-btn.on{border-color:var(--amber);color:var(--amber2);background:rgba(40,28,8,.85)}

.dock{flex:none;display:flex;gap:12px;height:140px}
.dock.compact{height:auto}
.card{border:1px solid var(--line);border-radius:10px;background:linear-gradient(180deg,rgba(11,20,38,.9),rgba(6,11,22,.9))}
.step-card{flex:1;min-width:0;display:flex;align-items:center;gap:18px;padding:10px 16px}
.step-card[hidden]{display:none}
.step-text{flex:1;min-width:0;max-height:100%;overflow-y:auto;text-align:center;scrollbar-width:thin}
.step-text .st-t{font:700 14px var(--mono);color:var(--cyan);letter-spacing:.04em}
.step-text .st-d{font-size:14px;line-height:1.5;color:var(--mut);margin-top:5px}
.step-text .st-d.formula{font:italic 17px/1.35 Georgia,"Times New Roman",serif;color:var(--ink)}
.st-note{display:inline-block;vertical-align:middle;max-width:160px;margin-left:18px;padding-left:12px;border-left:1px solid var(--line);text-align:left;font:400 12.5px/1.4 var(--body);font-style:normal;color:var(--amber2)}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 4px}
.frac .num{padding:0 5px}
.frac .den{padding:1px 5px 0;border-top:1px solid var(--mut)}
.step-nav{flex:none;display:flex;flex-direction:column;align-items:stretch;gap:7px;width:210px}
.step-nav .row{display:flex;gap:6px}
.step-nav .row .btn{flex:1;padding:7px 8px}
.step-count{font:700 12px var(--mono);letter-spacing:.12em;color:var(--amber2);text-align:center}
.step-dots{display:flex;justify-content:center;gap:4px;flex-wrap:wrap}
.step-dots span{width:7px;height:7px;border-radius:50%;background:rgba(110,170,255,.25);cursor:pointer;transition:.2s}
.step-dots span.done{background:rgba(95,217,255,.55)}
.step-dots span.cur{background:var(--amber);box-shadow:0 0 6px var(--amber)}
.readouts{flex:none;width:300px;display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;padding:14px 18px;align-content:center}
.dock.compact .readouts{flex:1;width:auto;display:flex;flex-wrap:wrap;gap:12px 40px;padding:12px 20px}
.stat{display:flex;flex-direction:column;gap:5px}
.s-l{font:400 12px/1 var(--mono);letter-spacing:.06em;color:var(--mut)}
.s-v{font:700 16px/1 var(--mono);white-space:nowrap}
.s-v.amb{color:var(--amber2)} .s-v.cyn{color:var(--cyan)} .s-v.tea{color:var(--teal)} .s-v.ink{color:var(--ink)} .s-v.cor{color:var(--coral)}

.panel{min-height:0;border:1px solid var(--line);border-radius:10px;
  background:linear-gradient(180deg,rgba(11,20,38,.9),rgba(6,11,22,.9));
  padding:13px 14px 11px;display:flex;flex-direction:column;gap:13px;animation:rise .55s .25s both;
  overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(95,217,255,.4) transparent}
.panel::-webkit-scrollbar{width:6px}
.panel::-webkit-scrollbar-thumb{background:rgba(95,217,255,.35);border-radius:3px}
.panel::-webkit-scrollbar-track{background:transparent}
.p-head{display:flex;align-items:center;gap:10px}
.p-head b{font:700 13px var(--mono);letter-spacing:.22em;color:var(--mut);white-space:nowrap}
.p-line{flex:1;height:1px;background:var(--line)}
.ctl{margin-top:8px;transition:opacity .25s}
.ctl.off{opacity:.35}
.ctl.off input{pointer-events:none}
.ctl-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:1px}
.ctl-top label{font-size:16.25px;color:var(--ink)}
.ctl-top label i{font-style:italic;font-family:var(--mono);color:var(--cyan)}
.ctl-top output{font:700 15px var(--mono);color:var(--amber2)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;
  background:linear-gradient(90deg,var(--cyan) var(--fill,50%),rgba(110,170,255,.22) var(--fill,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;margin-top:-5px;border-radius:3px;
  background:#0a1426;border:2px solid var(--cyan);box-shadow:0 0 9px rgba(95,217,255,.55);transition:transform .15s}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.2)}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:rgba(110,170,255,.22)}
input[type=range]::-moz-range-progress{height:3px;border-radius:2px;background:var(--cyan)}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:3px;background:#0a1426;border:2px solid var(--cyan)}
.hint{font-size:14px;line-height:1.45;color:var(--mut);margin-top:9px;padding:7px 10px;border-left:2px solid var(--cyan);background:rgba(95,217,255,.05)}
.hint i{font-family:var(--mono);color:var(--cyan)} .hint b{color:var(--amber2)}
.led{width:9px;height:9px;border-radius:50%;background:var(--teal);box-shadow:0 0 9px var(--teal);animation:blink 1.5s infinite;flex:none}
.led.paused{background:var(--amber);box-shadow:0 0 9px var(--amber);animation:none}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.anim-row{display:flex;gap:7px}
.anim-row .btn{flex:1}
.btn{font:700 12.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:9px 10px;border-radius:6px;
  border:1px solid var(--line);background:rgba(110,170,255,.06);color:var(--ink);cursor:pointer;transition:.2s}
.btn:hover{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 12px rgba(95,217,255,.15);transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;border-color:var(--line);color:var(--ink)}
.btn[hidden]{display:none}
.btn-primary{background:var(--cyan);border-color:var(--cyan);color:#04121a}
.btn-primary:hover{background:#9be8ff;color:#04121a;box-shadow:0 0 16px rgba(95,217,255,.4)}
.btn-primary:disabled{background:var(--cyan);color:#04121a}
.btn.on{border-color:var(--amber);color:var(--amber2);background:rgba(255,184,77,.1);box-shadow:inset 0 0 10px rgba(255,184,77,.12)}
.tgl{display:flex;align-items:center;gap:10px;font-size:15.5px;color:var(--mut);cursor:pointer;padding:4px 0;transition:color .2s}
.tgl:hover{color:var(--ink)}
.tgl input{display:none}
.tgl .sw{width:30px;height:16px;border:1px solid var(--line);border-radius:9px;position:relative;flex:none;background:rgba(110,170,255,.08);transition:.25s}
.tgl .sw::after{content:'';position:absolute;left:2px;top:2px;width:10px;height:10px;border-radius:50%;background:var(--mut);transition:.25s}
.tgl input:checked+.sw{background:rgba(95,217,255,.18);border-color:var(--cyan)}
.tgl input:checked+.sw::after{left:16px;background:var(--cyan);box-shadow:0 0 6px rgba(95,217,255,.7)}
.tgl .tx{line-height:1.2;flex:1}
.p-note{margin-top:auto;padding-top:10px;border-top:1px solid var(--line);font:400 13px var(--mono);letter-spacing:.04em;color:var(--mut)}
.p-note b{color:var(--amber2)}
@media (max-height:760px){
  .law-d{display:none}.hud-top{max-width:300px}
  .hint{display:none}.app{padding:10px 14px 8px;gap:8px}.panel{gap:10px;padding:10px 12px 8px}
  h1{font-size:clamp(18px,2vw,23px)}
  .dock{height:126px}.step-text .st-d{font-size:13px}.step-text .st-d.formula{font-size:15px}
}
@media (max-width:1020px){
  html,body{overflow:auto}.app{height:auto}main{grid-template-columns:1fr}
  .viewport{flex:none;height:60vh;min-height:420px}.panel{height:auto;overflow:visible}.h-right{align-items:flex-start}
  .dock{height:auto;flex-wrap:wrap}.step-card{flex-basis:100%;flex-wrap:wrap}.step-nav{width:100%}
  .readouts{width:100%}
  .hud-top{max-width:300px}
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="app">
  <header>
    <div class="h-left">
      <div class="overline" data-i18n="overline">Optique géométrique · télescope de Newton</div>
      <h1 data-i18n-html="h1">TÉLESCOPE <span>DE NEWTON</span></h1>
    </div>
    <div class="h-right">
      <button class="lang-btn" id="lang" title="FR / EN"><span class="lg-globe">🌐</span><span id="lang-lbl">EN · English</span></button>
      <nav class="tabs" aria-label="view">
        <button data-view="1" class="active"><span class="num">01</span><span class="lbl" data-i18n="tab1">Rayons</span></button>
        <button data-view="2"><span class="num">02</span><span class="lbl" data-i18n="tab2">Grossissement</span></button>
        <button data-view="3"><span class="num">03</span><span class="lbl" data-i18n="tab3">Pas à pas</span></button>
      </nav>
    </div>
  </header>

  <main>
    <div class="stage">
      <section class="viewport" id="viewport">
        <span class="ck tl"></span><span class="ck tr"></span><span class="ck bl"></span><span class="ck br"></span>
        <canvas id="sim"></canvas>

        <div class="hud hud-top" id="hud-top">
          <div class="law-k" id="law-k">VUE 01</div>
          <div class="title-row">
            <span class="def-inline" id="def-inline"><span data-i18n="def_btn">Définition</span><span class="def-pop" id="def-pop" data-i18n="def_txt"></span></span>
            <div class="law-t" id="law-t"></div>
          </div>
          <div class="law-d" id="law-d"></div>
        </div>

        <div class="tip" id="tip"></div>
        <div class="hud hud-indicator low" id="ind"><span class="ind-dot"></span><span id="ind-txt"></span></div>
        <div class="hud hud-flash" id="flash"></div>
        <button class="zoom-btn" id="btn-zoom"><span id="zoom-lbl">🔍 Zoom oculaire</span></button>
      </section>

      <div class="dock" id="dock">
        <div class="card step-card" id="hud-step" hidden>
          <div class="step-text"><div class="st-t" id="step-text-t"></div><div class="st-d" id="step-text-d"></div></div>
          <div class="step-nav">
            <span class="step-count" id="step-count"></span>
            <div class="step-dots" id="step-dots"></div>
            <div class="row">
              <button class="btn" id="step-prev"><span data-i18n="step_prev">◀ Préc</span></button>
              <button class="btn" id="step-next"><span data-i18n="step_next">Suiv ▶</span></button>
            </div>
            <div class="row">
              <button class="btn btn-primary" id="step-auto"><span id="step-auto-lbl">▶ Auto</span></button>
              <button class="btn btn-primary" id="step-replay" hidden><span data-i18n="step_replay">↻ Glisser L₂</span></button>
            </div>
          </div>
        </div>
        <div class="card readouts" id="readouts"></div>
      </div>
    </div>

    <aside class="panel">
      <div>
        <div class="p-head"><b data-i18n="sec_opt">OPTIQUE</b><span class="p-line"></span></div>
        <div class="ctl">
          <div class="ctl-top"><label for="sl-f1" data-i18n-html="lbl_f1">Focale du miroir <i>f₁</i></label><output id="out-f1">600 mm</output></div>
          <input type="range" id="sl-f1" min="300" max="1200" step="10" value="600" aria-label="f1">
        </div>
        <div class="ctl">
          <div class="ctl-top"><label for="sl-f2" data-i18n-html="lbl_f2">Focale de l’oculaire <i>f₂</i></label><output id="out-f2">40 mm</output></div>
          <input type="range" id="sl-f2" min="10" max="80" step="1" value="40" aria-label="f2">
        </div>
      </div>

      <div>
        <div class="p-head"><b data-i18n="sec_obs">OBSERVATION</b><span class="p-line"></span></div>
        <div class="ctl">
          <div class="ctl-top"><label for="sl-a" data-i18n-html="lbl_alpha">Inclinaison de l’astre <i>α</i></label><output id="out-a">1,50°</output></div>
          <input type="range" id="sl-a" min="-2" max="2" step="0.25" value="1.5" aria-label="alpha">
        </div>
        <div class="ctl" id="ctl-focus">

  angleArc(P.O2.x,P.O2.y,Math.atan2(-1,sB),-Math.PI/2,'#43e0b8','α′',isHot,'alphap',26);
}

/* ================= view 1 : ray path ================= */
function drawView1(){
  var g=geomFor(state.focus); if(!g)return; G=g;
  var P=pointsFor(g);
  var Yend=g.afocal?g.Yeye-4:g.cy-(BAND.top-30);
  var R=buildRays(g,3,Yend); state._rays=R;
  if(state.show.tube)drawTube(g);
  drawAxis(g,true);
  drawStar(g);
  if(state.show.foci) drawA1B1(g,P,true);
  if(state.show.ray){ drawRays(R); if(state.show.phot)drawPhotons(R); }
  if(state.show.foci){
    /* construction ray B2 -> O2 */
    var dir=norm(P.O2.x-P.B2.x,P.O2.y-P.B2.y), L=(P.B2.y-(g.cy-g.Yeye+4))/Math.max(-dir.y,0.2);
    var pb={x:P.B2.x+dir.x*L,y:P.B2.y+dir.y*L};
    seg(P.B2,pb,'rgba(67,224,184,.45)',1,0,[4,4]); hs(P.B2,pb,'rayO2',4);
    drawFinalImage(g,R,P);
    drawGap(g,P);
  }
  drawM1(g,false); drawM2(g,1); lensH(g,g.YL2,1);
  drawSlabel(g);
  drawA2B2(g,P);
  drawUpperLabels(g,P,{A2:true,B2:true,L2:true});
  alphaAtS(g,false);
  exitAngle(g,P,false);
  if(state.show.eye){drawEye(g);drawMedallions();}
}

/* ================= view 2 : proof of G ================= */
function drawView2(){
  var g=geomFor(0); if(!g)return; G=g;
  var step=state.step, P=pointsFor(g);
  var R=buildRays(g,3,g.Yeye-4); state._rays=R;
  if(state.show.tube)drawTube(g);
  drawAxis(g,true);
  drawStar(g);
  if(state.show.ray){ drawRays(R); if(state.show.phot)drawPhotons(R); }
  /* construction ray through S (ignores M2) */
  var x0={x:g.x0,y:g.cy-incY(g,0,g.x0)};
  seg(x0,{x:g.xM,y:g.cy},'rgba(95,217,255,.55)',1.3,0,[6,4]); seg({x:g.xM,y:g.cy},P.B1,'rgba(95,217,255,.55)',1.3,0,[6,4]);
  hs(x0,{x:g.xM,y:g.cy},'rayS',4); hs({x:g.xM,y:g.cy},P.B1,'rayS',4);
  drawM1(g,false); drawM2(g,1); lensH(g,g.YL2,1);
  drawSlabel(g);
  drawA1B1(g,P,true);
  if(step>=0) tri({x:g.xM,y:g.cy},P.F1,P.B1,'#5fd9ff',step===0,'tri1');
  if(step>=1){
    var hot1=step===1, L=g.hImg*0.9+30, p1=hot1?slowPulse():0;
    seg({x:g.xS2-L,y:g.cy-L},{x:g.xS2+g.s2+20,y:g.cy+g.s2+20},hot1?rgbs(213,239,255,0.3+0.6*p1):'rgba(213,239,255,.3)',hot1?1+1.6*p1:1,hot1?10*p1:0,[5,4]);
    hs({x:g.xS2-L,y:g.cy-L},{x:g.xS2+g.s2+20,y:g.cy+g.s2+20},'planM2',4);
    var cs=hot1?rgbs(255,217,143,0.35+0.6*p1):'rgba(255,217,143,.35)';
    seg(P.F1,P.A2,cs,hot1?1.2+1.6*p1:1.2,hot1?8*p1:0,[2,3]); seg(P.B1,P.B2,cs,hot1?1.2+1.6*p1:1.2,hot1?8*p1:0,[2,3]);
    if(hot1){ seg(P.F1,P.B1,rgbs(255,122,89,0.25+0.7*p1),2+3*p1,6+14*p1,null); seg(P.A2,P.B2,rgbs(255,122,89,0.25+0.7*p1),2+3*p1,6+14*p1,null); }
    hs(P.F1,P.A2,'sym',4); hs(P.B1,P.B2,'sym',4);
  }
  drawA2B2(g,P);
  drawUpperLabels(g,P,{A2:true,B2:true,L2:true});
  if(step>=2){ tri(P.O2,P.A2,P.B2,'#43e0b8',step===2,'tri2'); rightAngle(P.A2,{x:P.side,y:0},{x:0,y:-1},7);
    angleArc(P.O2.x,P.O2.y,Math.atan2(P.B2.y-P.O2.y,P.B2.x-P.O2.x),Math.PI/2,'#43e0b8','α′',step===2||step===3,'alphap',22); }
  angleArc(g.xM,g.cy,Math.atan2(P.B1.y-g.cy,P.B1.x-g.xM),Math.PI,'#ffd98f','α',step===0||step===3,'alpha',Math.max(34,g.F1*0.5));
  drawEye(g);
  if(step>=4)drawMedallions(step===4);
}

/* ================= view 3 : step-by-step construction ================= */
function drawStepView(){
  var step=state.step, off=(step===STEP_L2)?state.l2off:0;
  var g=geomFor(off); if(!g)return; G=g;
  var P=pointsFor(g), hasM2=step>=STEP_M2, hasL2=step>=STEP_L2;
  var pulse=0.5+0.5*Math.sin(performance.now()*0.006);
  function hot(k){return step===k;}
  var R1=buildRays(g,1), R2=buildRays(g,2,g.cy-8);
  var Yend=(step===STEP_L2&&!g.afocal)?g.cy-(BAND.top-30):g.Yeye-4;
  var R3=buildRays(g,3,Yend);
  var R=hasL2?R3:(hasM2?R2:R1);
  var Sp={x:g.xM,y:g.cy};

  if(state.show.tube)drawTube(g);
  drawAxis(g,hasM2);
  drawM1(g,hot(0));
  if(hot(0)){ctx.save();ctx.strokeStyle=rgbs(191,230,255,0.35+0.4*pulse);ctx.lineWidth=(1.4)*LWS;ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.ellipse(g.xM-4,g.cy,12,g.HL1+10,0,0,TAU);ctx.stroke();ctx.restore();}
  drawSlabel(g);
  if(step<4){ dot(P.F1.x,P.F1.y); geo(P.F1.x,g.cy+16,'F₁','center','rgba(200,216,240,.9)'); hp(P.F1.x,P.F1.y,'F1',10); }
  drawStar(g);

  /* 1 : incoming beam */
  if(step>=1){
    var c1=hot(1)?rgbs(255,217,143,0.7+0.3*pulse):'rgba(255,217,143,.85)';
    for(var i=0;i<R.length;i++){var r=R[i];
      seg(r.pts[0],r.pts[1],c1,hot(1)?2.5:1.6,hot(1)?8:4,null); hs(r.pts[0],r.pts[1],r.blocked?'rayBlock':'rayIn');
      if(r.blocked){var e=r.pts[1];ctx.save();ctx.strokeStyle='rgba(255,122,89,.9)';ctx.lineWidth=(2)*LWS;ctx.beginPath();ctx.moveTo(e.x-4,e.y-4);ctx.lineTo(e.x+4,e.y+4);ctx.moveTo(e.x+4,e.y-4);ctx.lineTo(e.x-4,e.y+4);ctx.stroke();ctx.restore();}
    }
    if(step<=2) alphaAtS(g,hot(1));
  }
  /* 2 : construction ray through S */
  if(step>=2){
    var a2=hot(2)?0.75+0.25*pulse:(hasM2?0.3:0.6), c2=rgbs(95,217,255,a2);
    var xs={x:g.x0,y:g.cy-incY(g,0,g.x0)};
    seg(xs,Sp,c2,hot(2)?2.4:1.3,hot(2)?8:0,[6,4]); seg(Sp,P.B1,c2,hot(2)?2.4:1.3,hot(2)?8:0,[6,4]);
    hs(xs,Sp,'rayS',4); hs(Sp,P.B1,'rayS',4);
    if(hot(2)||hot(3)) angleArc(g.xM,g.cy,Math.atan2(P.B1.y-g.cy,P.B1.x-g.xM),Math.PI,'#5fd9ff','α',hot(2),'alpha',34);
  }
  /* 3 : reflected rays converge in the focal plane of M1 */
  if(step>=3&&!hasM2){
    ctx.save();ctx.strokeStyle=hot(3)?rgbs(255,184,77,0.5+0.4*pulse):'rgba(255,184,77,.4)';ctx.lineWidth=(1)*LWS;ctx.setLineDash([3,4]);
    ctx.beginPath();ctx.moveTo(P.F1.x,g.cy-g.HL1);ctx.lineTo(P.F1.x,g.cy+g.HL1);ctx.stroke();ctx.restore();
    hs({x:P.F1.x,y:g.cy-g.HL1},{x:P.F1.x,y:g.cy+g.HL1},'planF1',3);
    var c3=hot(3)?rgbs(255,184,77,0.7+0.3*pulse):'rgba(255,184,77,.85)';
    for(var j=0;j<R1.length;j++){seg(R1[j].pts[1],P.B1,c3,hot(3)?2.3:1.6,hot(3)?7:3,null);hs(R1[j].pts[1],P.B1,'rayM1');}
  }
  /* 4 : image A1B1 (inside the tube) ; rays diverge after B1 */
  if(step>=4){
    if(!hasM2){
      ctx.fillStyle='#ff7a59';ctx.shadowColor='#ff7a59';ctx.shadowBlur=hot(4)?12:7;
      ctx.beginPath();ctx.arc(P.B1.x,P.B1.y,hot(4)?5:3.6,0,TAU);ctx.fill();ctx.shadowBlur=0;
      drawA1B1(g,P,false);
    } else drawA1B1(g,P,true);
  }
  if(step===4){ for(var q=0;q<R1.length;q++){fadeSeg(P.B1,R1[q].pts[2],'#ffb84d',1.8,true);hs(P.B1,R1[q].pts[2],'rayDiv');} }
  /* 5 : secondary mirror */
  if(hasM2){
    var la=hot(5)?clamp(state._stepT*2,0,1):1;
    for(var k=0;k<R.length;k++){var rr=R[k]; if(rr.blocked)continue;
      seg(rr.pts[1],rr.pts[2],'rgba(255,184,77,.85)',1.6,3,null); hs(rr.pts[1],rr.pts[2],'rayM1');
      if(!hasL2){ seg(rr.pts[2],P.B2,'rgba(255,154,92,.9)',1.7,4,null); hs(rr.pts[2],P.B2,'rayM2');
        fadeSeg(P.B2,rr.pts[3],'#ff9a5c',1.6,true); hs(P.B2,rr.pts[3],'rayDivUp'); }
      else { seg(rr.pts[2],rr.pts[3],'rgba(255,154,92,.9)',1.7,4,null); hs(rr.pts[2],rr.pts[3],'rayM2'); }
    }
    drawM2(g,la);
    if(hot(5)){
      var L=g.hImg*0.9+30, ca=rgbs(213,239,255,0.3+0.4*pulse);
      seg({x:g.xS2-L,y:g.cy-L},{x:g.xS2+g.s2+20,y:g.cy+g.s2+20},ca,1,0,[5,4]);
      hs({x:g.xS2-L,y:g.cy-L},{x:g.xS2+g.s2+20,y:g.cy+g.s2+20},'planM2',4);
      var cs=rgbs(255,217,143,0.5+0.4*pulse);
      seg(P.F1,P.A2,cs,1.3,0,[2,3]); seg(P.B1,P.B2,cs,1.3,0,[2,3]);
      hs(P.F1,P.A2,'sym',4); hs(P.B1,P.B2,'sym',4);
    }
    ctx.fillStyle='#ff7a59';ctx.shadowColor='#ff7a59';ctx.shadowBlur=hot(5)?12:6;
    ctx.beginPath();ctx.arc(P.B2.x,P.B2.y,hot(5)?4.6:3.2,0,TAU);ctx.fill();ctx.shadowBlur=0;
    drawA2B2(g,P);
  }
  /* 6+ : eyepiece */
  if(hasL2){
    var ll=(hot(STEP_L2)&&state.slide.on)?clamp(state.slide.t*10,0,1):1;
    lensH(g,g.YL2,ll);
    if(hot(STEP_L2)&&!state.slide.on&&!state.dragging){
      ctx.save();ctx.strokeStyle=rgbs(67,224,184,0.25+0.35*pulse);ctx.lineWidth=(1.2)*LWS;ctx.setLineDash([3,3]);
      ctx.beginPath();ctx.ellipse(g.xS2,g.cy-g.YL2,g.hl2+10,10,0,0,TAU);ctx.stroke();ctx.restore();
      geo(g.xS2-P.side*(g.hl2+30),g.cy-g.YL2+6,'↕','center',rgbs(67,224,184,0.5+0.4*pulse),'700 17px '+MONO);
    }
  }
  drawUpperLabels(g,P,{A2:hasM2,B2:hasM2,L2:hasL2,la:hasL2?((hot(STEP_L2)&&state.slide.on)?clamp(state.slide.t*10,0,1):1):1});
  if(step===STEP_L2){
    for(var n=0;n<R3.length;n++){var r3=R3[n]; if(r3.blocked)continue; seg(r3.pts[3],r3.pts[4],'rgba(67,224,184,.9)',1.8,5,null); hs(r3.pts[3],r3.pts[4],'rayOut');}
    drawFinalImage(g,R3,P);
    drawGap(g,P);
    var st=g.afocal?['st_par','rgba(120,255,225,.95)']:(off>0?['st_conv','rgba(255,140,110,.95)']:['st_div','rgba(255,200,110,.95)']);
    ctx.save();ctx.setTransform(DPR,0,0,DPR,0,0);var oF=FZS;FZS=1; geo(34,cssH-22,D()[st[0]],'left',st[1],'700 12.5px '+MONO); FZS=oF; ctx.restore();
  }
  /* 7 : construction ray ① through O2 */
  var yTop=g.cy-g.Yeye-20;
  var dO=norm(P.O2.x-P.B2.x,P.O2.y-P.B2.y), LO=(P.B2.y-yTop)/Math.max(-dO.y,0.15), endO={x:P.B2.x+dO.x*LO,y:P.B2.y+dO.y*LO};
  if(step>=7){
    var a7=hot(7)?0.75+0.25*pulse:0.5;
    seg(P.B2,endO,rgbs(190,150,255,a7),hot(7)?2.4:1.4,hot(7)?8:0,[6,4]); hs(P.B2,endO,'rayO2');
    geo(P.O2.x+dO.x*g.F2*1.45-P.side*10,P.O2.y+dO.y*g.F2*1.45+4,'①',P.side>0?'right':'left',rgbs(190,150,255,0.95),'700 13px '+MONO);
    if(hot(7)) exitAngle(g,P,true);
  }
  /* 8 : construction ray ② parallel to the eyepiece axis, then through F2' */
  if(step>=8){
    var a8=hot(8)?0.75+0.25*pulse:0.5, c8=rgbs(255,140,200,a8);
    var Q={x:P.B2.x,y:P.O2.y};
    seg(P.B2,Q,c8,hot(8)?2.4:1.4,hot(8)?8:0,[6,4]); hs(P.B2,Q,'rayPar');
    var dq=norm(P.F2p.x-Q.x,P.F2p.y-Q.y), LQ=(Q.y-yTop)/Math.max(-dq.y,0.15), endQ={x:Q.x+dq.x*LQ,y:Q.y+dq.y*LQ};
    seg(Q,endQ,c8,hot(8)?2.4:1.4,hot(8)?8:0,[6,4]); hs(Q,endQ,'rayPar');
    geo(P.B2.x+P.side*9,(P.B2.y+Q.y)/2+4,'②',P.side>0?'left':'right',rgbs(255,140,200,0.95),'700 13px '+MONO);
    if(hot(8)){
      var ang=Math.atan2(dq.y,dq.x), ys=[P.O2.y-g.F2*1.15, P.O2.y-g.F2*1.9];
      for(var z=0;z<ys.length;z++){
        if(ys[z]<yTop+6)continue;
        var tq=(ys[z]-Q.y)/dq.y, tO=(ys[z]-P.O2.y)/dO.y;
        arrowHead(Q.x+dq.x*tq,ys[z],ang,c8,9); arrowHead(P.O2.x+dO.x*tO,ys[z],ang,rgbs(190,150,255,0.95),9);
      }
      var ym=P.O2.y-g.F2*1.5, xm=Math.max(Q.x+dq.x*((ym-Q.y)/dq.y),P.O2.x+dO.x*((ym-P.O2.y)/dO.y));
      if(P.side<0)xm=Math.min(Q.x+dq.x*((ym-Q.y)/dq.y),P.O2.x+dO.x*((ym-P.O2.y)/dO.y));
      geo(xm+(P.side>0?-1:1)*0+(P.side>0?12:-12),ym,'① ∥ ②',P.side>0?'left':'right','rgba(234,242,255,.95)','700 12px '+MONO);
    }
  }
  /* 9 : real rays emerge one after the other */
  if(step>=9){
    var U=R3.filter(function(r){return !r.blocked;});
    for(var w=0;w<U.length;w++){
      var f=step>9?1:clamp((state._stepT-0.3-0.6*w)/0.6,0,1); if(f<=0)continue;
      var p3=U[w].pts[3], p4=U[w].pts[4], pe={x:p3.x+(p4.x-p3.x)*f,y:p3.y+(p4.y-p3.y)*f};
      seg(p3,pe,'rgba(67,224,184,.95)',(hot(9)&&f<1)?2.6:1.8,hot(9)?8:4,null); hs(p3,pe,'rayOut');
      if(hot(9)&&f<1){ctx.fillStyle='#e9fffa';ctx.beginPath();ctx.arc(pe.x,pe.y,3,0,TAU);ctx.fill();}
    }
  }
  /* 10 : eye + alpha' */
  if(step>=10){ drawEye(g); exitAngle(g,P,hot(10)); alphaAtS(g,false); }
  if(step>=11) drawMedallions();
}

/* ================= HUD / readouts ================= */
var RO={};
var readouts=$('readouts'), dock=$('dock');
function buildReadouts(){
  var L=D();
  var defs={
   1:[['f1',L.ro_f1,'cyn'],['f2',L.ro_f2,'amb'],['G',L.ro_G,'tea'],['b',L.ro_b,'ink'],['gap',L.ro_gap,'cor']],
   2:[['a',L.ro_a,'cyn'],['b',L.ro_b,'amb'],['G',L.ro_G,'tea'],['rap',L.ro_rap,'ink']],
   3:[['a',L.ro_a,'cyn'],['b',L.ro_b,'amb'],['G',L.ro_G,'tea'],['step',L.ro_step,'ink']]
  };
  var html='';
  for(var i=0;i<defs[state.view].length;i++){var d=defs[state.view][i];
    html+='<div class="stat"><span class="s-l">'+d[1]+'</span><span class="s-v '+d[2]+'" id="ro-'+d[0]+'">—</span></div>';}
  readouts.innerHTML=html; RO={};
  for(var j=0;j<defs[state.view].length;j++){var id=defs[state.view][j][0];RO[id]=$('ro-'+id);}
}
function curOff(){return state.view===1?state.focus:((state.view===3&&state.step===STEP_L2)?state.l2off:0);}
function alphaPrimeDeg(){
  var den=state.f2+curOff(); if(den<=0.01)return 90;
  return Math.atan(Math.abs(state.f1*Math.tan(state.alpha*DEG)/den))/DEG;
}
function updateReadouts(){
  var L=D(), ap=alphaPrimeDeg(), Gs=fmt(Gval(),1)+L.u_x;
  if(state.view===1){
    setTxt(RO.f1,state.f1+L.u_mm); setTxt(RO.f2,state.f2+L.u_mm); setTxt(RO.G,Gs);
    setTxt(RO.b,fmt(ap,1)+L.u_deg); setTxt(RO.gap,(state.focus>0?'+':'')+state.focus+L.u_mm);
  } else if(state.view===2){
    setTxt(RO.a,fmt(Math.abs(state.alpha),2)+L.u_deg); setTxt(RO.b,fmt(ap,1)+L.u_deg);
    setTxt(RO.G,Gs); setTxt(RO.rap,fmt(Gval(),1));
  } else {
    setTxt(RO.a,fmt(Math.abs(state.alpha),2)+L.u_deg);
    setTxt(RO.b,state.step>=7||(state.step===STEP_L2&&Math.abs(state.l2off)<0.5)?fmt(ap,1)+L.u_deg:'—');
    setTxt(RO.G,state.step>=11?Gs:'—');
    setTxt(RO.step,(state.step+1)+' / '+(stepMax()+1));
  }
}
var indEl=$('ind'), indTxt=$('ind-txt');

function updateIndicator(){

}

/* ================= step UI ================= */
function buildDots(){
  var h='';for(var i=0;i<=stepMax();i++)h+='<span data-s="'+i+'"></span>';
  $('step-dots').innerHTML=h;
  var sp=$('step-dots').children;
  for(var j=0;j<sp.length;j++){(function(el){el.addEventListener('click',function(){goStep(+el.dataset.s);});})(sp[j]);}
}
function refreshStep(){
  if(state.view===1)return;
  var n=state.step, mx=stepMax();
  setTxt($('step-count'), t('step_count',{n:n+1,max:mx+1}));
  if(state.view===2){
    $('step-text-t').textContent=D()['d'+n+'_t'];
    $('step-text-d').className='st-d formula';
    $('step-text-d').innerHTML=D()['d'+n+'_f'];
  } else {
    $('step-text-t').textContent=(n+1)+'. '+D()['s'+n+'_t'];
    $('step-text-d').className='st-d';
    $('step-text-d').textContent=t('s'+n+'_d',{f1:state.f1,f2:state.f2,G:fmt(Gval(),1)});
  }
  $('step-prev').disabled = n<=0;
  $('step-next').disabled = n>=mx;
  $('step-auto').hidden = state.view!==2;
  $('step-replay').hidden = !(state.view===3 && n===STEP_L2);
  var sp=$('step-dots').children;
  for(var i=0;i<sp.length;i++){sp[i].className=i===n?'cur':(i<n?'done':'');}
  updateFocusCtl(); autoZoom();
}
function slideOff(u){
  var A=Math.min(15,0.5*state.f2), B=-Math.min(12,0.4*state.f2);
  if(u<0.38)return A+(B-A)*ease(u/0.38);
  if(u<0.52)return B;
  if(u<0.9)return B*(1-ease((u-0.52)/0.38));
  return 0;
}
function startSlide(){state.slide.on=true;state.slide.t=0;state.l2off=slideOff(0);syncFocusSlider();}
function advanceSlide(dt){
  var s=state.slide; s.t+=dt*state.speed/7;
  if(s.t>=1){s.t=1;s.on=false;state.l2off=0;flash(t('f_par'));}
  else state.l2off=slideOff(s.t);
  syncFocusSlider();
}
function goStep(n){
  var prev=state.step, mx=stepMax(); n=clamp(n,0,mx);
  state.step=n; state._stepT=0;
  if(state.view===3){
    if(n===STEP_L2){ if(prev<STEP_L2) startSlide(); else {state.slide.on=false; state.l2off=0;} }
    else {state.slide.on=false; state.l2off=0;}
  }
  refreshStep(); if(n!==prev)flash(t('f_step',{n:n+1}));
}
$('step-prev').addEventListener('click',function(){goStep(state.step-1);});
$('step-next').addEventListener('click',function(){goStep(state.step+1);});
$('step-auto').addEventListener('click',function(){togglePlay();});
$('step-replay').addEventListener('click',function(){startSlide();});

/* ================= pointer : hover + vertical drag of L2 ================= */
function canDragL2(){return state.view===1||(state.view===3&&state.step===STEP_L2);}
function overL2(mx,my){return G&&Math.abs(my-(G.cy-G.YL2))*CAM.k<14&&Math.abs(mx-G.xS2)<G.hl2+12/CAM.k;}
var down=null;
function evPos(e){var r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
function offMin(){return -Math.min(15,Math.floor(0.6*state.f2));}
function dragTo(my){
  if(!G)return;
  var raw=((G.cy-my)-G.Ya)/G.ESC, off=clamp(Math.round(raw),offMin(),15);
  if(Math.abs(raw)<1.2)off=0;
  var prev=state.view===1?state.focus:state.l2off;
  if(state.view===1)state.focus=off; else {state.slide.on=false;state.l2off=off;}
  syncFocusSlider();
  if(off===0&&Math.round(prev)!==0)flash(t('f_par'));
}
function toW(p){return {x:(p.x-CAM.tx)/CAM.k,y:(p.y-CAM.ty)/CAM.k};}
cv.addEventListener('pointermove',function(e){var p=evPos(e);MOUSE.x=p.x;MOUSE.y=p.y;MOUSE.in=true;
  if(state.dragging){dragTo(toW(p).y);if(down)down.moved=true;}
  else if(down&&Math.hypot(p.x-down.x,p.y-down.y)>5)down.moved=true;});
cv.addEventListener('pointerleave',function(){MOUSE.in=false;});
cv.addEventListener('pointerdown',function(e){var p=evPos(e);MOUSE.x=p.x;MOUSE.y=p.y;MOUSE.in=true;down={x:p.x,y:p.y,moved:false};
  var w=toW(p); if(canDragL2()&&overL2(w.x,w.y)){state.dragging=true;try{cv.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();}});
function endPointer(e){
  var wasDrag=state.dragging; state.dragging=false;
  if(down&&!down.moved&&!wasDrag&&state.view!==3)togglePlay();
  down=null; if(e.pointerType!=='mouse')MOUSE.in=false;
}
cv.addEventListener('pointerup',endPointer);
cv.addEventListener('pointercancel',function(){state.dragging=false;down=null;});

/* ================= controls ================= */
var slF1=$('sl-f1'),slF2=$('sl-f2'),slA=$('sl-a'),slFo=$('sl-focus'),slSp=$('sl-sp');
var outF1=$('out-f1'),outF2=$('out-f2'),outA=$('out-a'),outFo=$('out-focus'),outSp=$('out-sp'),led=$('led');
function paintRange(el){var p=(el.value-el.min)/(el.max-el.min)*100;el.style.setProperty('--fill',p+'%');}
function fmtOff(v){v=Math.round(v);return (v>0?'+':'')+v+D().u_mm;}
function syncFocusSlider(){
  var v=state.view===3?state.l2off:state.focus;
  slFo.value=Math.round(v); paintRange(slFo); outFo.textContent=fmtOff(v);
}
function updateFocusRange(){
  slFo.min=offMin();
  if(state.focus<offMin())state.focus=offMin();
  if(state.l2off<offMin())state.l2off=offMin();
  syncFocusSlider();
}
function updateFocusCtl(){
  var on=state.view===1||(state.view===3&&state.step===STEP_L2);
  $('ctl-focus').classList.toggle('off',!on);
  syncFocusSlider();
}
function syncControls(){
  outF1.textContent=state.f1+D().u_mm; outF2.textContent=state.f2+D().u_mm;
  outA.textContent=fmt(state.alpha,2)+D().u_deg; syncFocusSlider();
  $('hint').innerHTML=D()['hint'+state.view];
}
slF1.addEventListener('input',function(){state.f1=+slF1.value;outF1.textContent=state.f1+D().u_mm;refreshStep();flash(t('f_f1',{v:state.f1}));});
slF2.addEventListener('input',function(){state.f2=+slF2.value;outF2.textContent=state.f2+D().u_mm;updateFocusRange();refreshStep();flash(t('f_f2',{v:state.f2}));});
slA.addEventListener('input',function(){state.alpha=+slA.value;outA.textContent=fmt(state.alpha,2)+D().u_deg;flash(t('f_alpha',{v:fmt(state.alpha,2)}));});
slFo.addEventListener('input',function(){
  var v=+slFo.value;
  if(state.view===1){state.focus=v;flash(v===0?t('f_par'):t('f_focus',{v:fmtOff(v)}));}
  else if(state.view===3&&state.step===STEP_L2){state.slide.on=false;state.l2off=v;if(v===0)flash(t('f_par'));}
  outFo.textContent=fmtOff(v);
});
slSp.addEventListener('input',function(){state.speed=+slSp.value;outSp.textContent='×'+fmt(state.speed,2);});

['ray','foci','tube','eye','phot','tip'].forEach(function(k){$('tg-'+k).addEventListener('change',function(e){state.show[k]=e.target.checked;});});

var btnPlay=$('btn-play'), btnFast=$('btn-fast');
function setPlayUI(){
  btnPlay.textContent=state.playing?D().btn_pause:D().btn_play;
  btnPlay.disabled=state.view===3;
  led.classList.toggle('paused',!state.playing);
  $('step-auto-lbl').textContent=state.playing?D().step_stop:D().step_auto;
  btnFast.textContent=state.view===1?D().btn_demo:D().btn_end;
  btnFast.classList.toggle('on',state.view===1&&state.fast);
}
function togglePlay(){
  if(state.view===3)return;
  state.playing=!state.playing;
  if(state.view===2 && state.playing){ if(state.step>=stepMax()){state.step=0;refreshStep();} state._stepT=0; }
  setPlayUI();
}
btnPlay.addEventListener('click',togglePlay);
addEventListener('keydown',function(ev){
  var tag=(ev.target&&ev.target.tagName)||'';
  if(tag==='INPUT'||(tag==='BUTTON'&&ev.code==='Space'))return;
  if(ev.code==='Space'){ev.preventDefault();togglePlay();}
  else if((state.view===2||state.view===3)&&ev.code==='ArrowRight'){ev.preventDefault();goStep(state.step+1);}
  else if((state.view===2||state.view===3)&&ev.code==='ArrowLeft'){ev.preventDefault();goStep(state.step-1);}
});
$('btn-reset').addEventListener('click',function(){
  if(state.view===2||state.view===3){ state.playing=false; goStep(0); setPlayUI(); }
  else { state.playing=false; state.focus=0; syncFocusSlider(); setPlayUI();
    for(var i=0;i<state.photons.length;i++){state.photons[i].s=((i%3)/3+Math.floor(i/3)*0.08)%1;} }
  flash(t('f_reset'));
});
btnFast.addEventListener('click',function(){
  if(state.view===2||state.view===3){ state.playing=false; goStep(stepMax()); setPlayUI(); flash(t('f_done')); }
  else { state.fast=!state.fast; setPlayUI(); flash(state.fast?t('f_fast_on'):t('f_fast_off')); }
});

var lawK=$('law-k'),lawT=$('law-t'),lawD=$('law-d');
function refreshViewText(){lawK.textContent=t('view_k',{n:state.view});lawT.textContent=D()['v'+state.view+'_t'];lawD.textContent=D()['v'+state.view+'_d'];$('hint').innerHTML=D()['hint'+state.view];}
function setView(n){
  state.view=n;
  var bs=document.querySelectorAll('.tabs button');
  for(var i=0;i<bs.length;i++){bs[i].classList.toggle('active',+bs[i].dataset.view===n);}
  var steps=(n===2||n===3);
  $('hud-step').hidden=!steps; dock.classList.toggle('compact',!steps);
  state.step=0; state._stepT=0; state.slide.on=false; state.l2off=0; state.zoom=false; state._zkey=n+':0'; setZoomUI();
  state.playing=(n===2);
  buildDots(); setPlayUI(); refreshViewText(); buildReadouts();
  if(steps) refreshStep(); else updateFocusCtl();
  requestAnimationFrame(updateBand);
}
(function(){var bs=document.querySelectorAll('.tabs button');for(var i=0;i<bs.length;i++){(function(b){b.addEventListener('click',function(){setView(+b.dataset.view);});})(bs[i]);}})();
(function(){var rs=document.querySelectorAll('input[type=range]');for(var i=0;i<rs.length;i++){(function(el){paintRange(el);el.addEventListener('input',function(){paintRange(el);});})(rs[i]);}})();

/* ================= language ================= */
function applyLang(){
  document.documentElement.lang=state.lang==='fr'?'fr':'en';
  var a=document.querySelectorAll('[data-i18n]');for(var i=0;i<a.length;i++){var k=a[i].getAttribute('data-i18n');if(D()[k]!=null)a[i].textContent=D()[k];}
  var b=document.querySelectorAll('[data-i18n-html]');for(var j=0;j<b.length;j++){var k2=b[j].getAttribute('data-i18n-html');if(D()[k2]!=null)b[j].innerHTML=D()[k2];}
  $('btn-reset').textContent=D().btn_reset; outSp.textContent='×'+fmt(state.speed,2);
  $('lang-lbl').textContent=state.lang==='fr'?'EN · English':'FR · Français';
  document.title=state.lang==='fr'?'Télescope de Newton — Simulation':'Newtonian telescope — Simulation';
  tipEl.__h=null;
  refreshViewText();syncControls();buildReadouts();refreshStep();setPlayUI();setZoomUI();
}
$('lang').addEventListener('click',function(){state.lang=state.lang==='fr'?'en':'fr';applyLang();flash(t('f_lang'));});

/* ================= camera (zoom on the eyepiece) ================= */
function camTarget(){
  var T0={k:1,tx:0,ty:0};
  if(!state.zoom)return T0;
  var g=geomFor(curOff()); if(!g)return T0;
  var Ymin=g.hImg-0.55*g.F2-14, Ymax=g.Yeye+28, top=48, bot=cssH-18;
  var k=clamp((bot-top)/(Ymax-Ymin),1,3.4);
  return {k:k, tx:cssW*0.6-k*g.xS2, ty:top-k*(g.cy-Ymax)};
}
function updateCam(dt){var T1=camTarget(),a=Math.min(1,dt*5);CAM.k+=(T1.k-CAM.k)*a;CAM.tx+=(T1.tx-CAM.tx)*a;CAM.ty+=(T1.ty-CAM.ty)*a;}
function setZoomUI(){$('zoom-lbl').textContent=state.zoom?D().zoom_out:D().zoom_in;$('btn-zoom').classList.toggle('on',state.zoom);}
function autoZoom(){var k=state.view+':'+state.step; if(k===state._zkey)return; state._zkey=k;
  state.zoom=(state.view===3&&state.step>=STEP_L2&&state.step<=10)||(state.view===2&&(state.step===2||state.step===3)); setZoomUI();}
$('btn-zoom').addEventListener('click',function(e){e.stopPropagation();state.zoom=!state.zoom;setZoomUI();});

/* ================= loop ================= */
var last=performance.now();
function loop(tt){
  var dt=Math.min((tt-last)/1000,0.05);last=tt;
  if(state.view===3){
    state._stepT+=dt;
    if(state.step===STEP_L2&&state.slide.on&&!state.dragging)advanceSlide(dt);
  }
  if(state.playing){
    if(state.view===2){
      state._stepT+=dt;
      if(state._stepT>=2.8){ state._stepT=0;
        if(state.step<stepMax()){ state.step++; refreshStep(); }
        else { state.playing=false; setPlayUI(); flash(t('f_done')); }
      }
    }
    if((state.view===1||state.view===2) && state.show.phot){
      var v=0.12*state.speed*(state.fast?6:1);
      for(var i=0;i<state.photons.length;i++){state.photons[i].s=(state.photons[i].s+v*dt)%1;}
    }
  }
  drawBg(tt);
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,cssW,cssH);
  updateCam(dt);
  ctx.setTransform(DPR*CAM.k,0,0,DPR*CAM.k,DPR*CAM.tx,DPR*CAM.ty);
  LWS=Math.pow(CAM.k,-0.7); FZS=Math.pow(CAM.k,-0.62);
  HOT=[];
  if(state.view===1)drawView1(); else if(state.view===2)drawView2(); else drawStepView();
  pickHover(); drawHover(); ctx.setTransform(DPR,0,0,DPR,0,0); LWS=1; FZS=1; updateTip(); updateCursor();
  updateReadouts();updateIndicator();
  requestAnimationFrame(loop);
}

setView(1); applyLang(); setPlayUI(); updateFocusRange();
flash(t('f_ready'));
requestAnimationFrame(loop);
window.__TEL_OK__=true;
</script>
